apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: nginx-jwt-auth
  namespace: default
spec:
  selector:
    matchLabels:
      run: my-nginx
  jwtRules:
  - issuer: "testing@secure.istio.io"
    # FIXED: Scheme 'https://' is mandatory in 2026
    jwksUri: "https://raw.githubusercontent.com/istio/istio/release-1.28/security/tools/jwt/samples/jwks.json"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nginx-require-jwt
  namespace: default
spec:
  selector:
    matchLabels:
      run: my-nginx
  action: ALLOW
  rules:
  - from:
    - source:
        # Require a valid principal (issuer + / + subject)
        requestPrincipals: ["testing@secure.istio.io/*"]

