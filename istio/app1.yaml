apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-v1
  namespace: prod-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      version: v1
  template:
    metadata:
      labels:
        app: nginx
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: nginx-v1-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-v1-html
  namespace: prod-app
data:
  index.html: |
    <h1>This is NGINX Version V1</h1>

